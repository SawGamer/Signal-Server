turn:
  cloudflare:
    apiToken: secret://turn.cloudflare.apiToken
    endpoint: https://rtc.live.cloudflare.com/v1/turn/keys/LMNOP/credentials/generate
    requestedCredentialTtl: PT24H
    clientCredentialTtl: PT12H
    urls:
      - turn:turn.example.com:80
    urlsWithIps:
      - turn:%s
      - turn:%s:80?transport=tcp
      - turns:%s:443?transport=tcp
    hostname: turn.cloudflare.example.com
    numHttpClients: 1

linkDevice:
  secret: secret://linkDevice.secret

externalRequestFilter:
  grpcMethods:
    - com.example.grpc.ExampleService/exampleMethod
  paths:
    - /example
  permittedInternalRanges:
    - 127.0.0.0/8

idlePrimaryDeviceReminder:
  minIdleDuration: P30D

grpc:
  bindAddress: 0.0.0.0       # "omnibus" HTTP/2 front door: gRPC + websocket routing
  port: 50051
  websocketPort: 8080
  h2c: true                  # TLS is terminated by Caddy

asnTable:
  type: file
  path: /etc/signal/asn.tsv.gz      # gzipped TSV (IP range -> ASN); empty is fine
  refreshInterval: PT1H

callQualitySurvey:
  pubSubPublisher:
    type: disabled

hlrLookup:
  apiKey: secret://hlrLookup.apiKey
  apiSecret: secret://hlrLookup.apiSecret

server:
  allowedMethods:
    - GET
    - POST
    - PUT
    - DELETE
    - HEAD
    - OPTIONS
    - PATCH
    - CONNECT
  applicationConnectors:
    - type: h2c
      port: 8080
      useForwardedHeaders: true

foundationDbMessages:
  maxWatchesPerClient: 10000
  transactionTimeout: PT1S
  transactionRetryLimit: 3
  batchPriorityTransactionTimeout: PT5S
  batchPriorityTransactionRetryLimit: 10
  versionstampCipherKeys:
    0: secret://foundationDbMessages.versionstampCipherKey.0
  currentVersionstampCipherKey: 0
  clusters:
    "messages-0":
      clusterFileUrl: file:///etc/foundationdb/fdb.cluster
  epochs:
    0:
      - messages-0

registrationWebAuthn:
  relyingPartyId: ${DOMAIN:-localhost}
  origins:
    - https://${DOMAIN:-localhost}
  challengeTtl: PT2M
  userHandleBlindingSecret: secret://registrationWebAuthn.userHandleBlindingSecret

