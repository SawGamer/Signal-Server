# Signal-Server configuration for SELF-HOSTING (docker compose in this directory).
#
# Derived from service/src/test/resources/config/test.yml, the config Signal uses to run the server locally,
# with every AWS/Google dependency swapped for a self-hosted equivalent:
#   DynamoDB -> DynamoDB Local          S3 -> SeaweedFS            Redis cluster -> single-node Redis cluster
#   FoundationDB -> single-node FDB     dynamic config -> local file
#   registration service -> ../registration-service (Twilio)
#
# Dollar-brace variables come from .env (written by setup.sh); secret:// values from secrets/secrets.yml.
# Sections for features not run yet (donations, payments, contact discovery, PIN backup, key transparency,
# Cloudflare TURN, Apple/Google billing) keep Signal's inert test values so the server starts.

logging:
  level: INFO
  appenders:
    - type: console
      threshold: ALL
      timeZone: UTC
      target: stdout

health:
  delayedShutdownHandlerEnabled: false

awsCredentialsProvider:
  type: static
  accessKeyId: secret://aws.accessKeyId
  secretAccessKey: secret://aws.secretAccessKey

tlsKeyStore:
  password: secret://tlsKeyStore.password

stripe:
  apiKey: secret://stripe.apiKey
  idempotencyKeyGenerator: secret://stripe.idempotencyKeyGenerator
  boostDescription: >
    Example
  supportedCurrenciesByPaymentMethod:
    CARD:
      - usd
      - eur
    SEPA_DEBIT:
      - eur

braintree:
  merchantId: unset
  publicKey: secret://braintree.publicKey
  privateKey: secret://braintree.privateKey
  environment: sandbox
  graphqlUrl: unset
  merchantAccounts:
    # ISO 4217 currency code and its corresponding sub-merchant account
    'xts': unset
  supportedCurrenciesByPaymentMethod:
    PAYPAL:
      - usd
      - xts
  pubSubPublisher:
    type: disabled

googlePlayBilling:
  credentialsJson: |
    {
      "type": "external_account",
      "credential_source": {
        "file": "/tmp/my-token"
      },
      "subject_token_type": "urn:ietf:params:oauth:token-type:jwt",
      "audience": "//iam.googleapis.com/abc",
      "token_url": "https://sts.googleapis.com/v1/token"
    }
  packageName: package.name
  applicationName: test
  productIdToLevel: {}

appleAppStore:
  env: LOCAL_TESTING
  bundleId: bundle.name
  appAppleId: 12345
  issuerId: abcdefg
  keyId: abcdefg
  encodedKey: secret://appleAppStore.encodedKey
  subscriptionGroupId: example_subscriptionGroupId
  productIdToLevel: {}
  appleRootCerts:
    # An apple root cert https://www.apple.com/certificateauthority/
    - 

appleDeviceCheck:
  production: false
  teamId: 0123456789
  bundleId: bundle.name

deviceCheck:
  backupRedemptionDuration: P30D

dynamoDbClient:
  type: endpoint            # DynamoDB-compatible database (DynamoDB Local) instead of AWS
  endpoint: ${DYNAMODB_ENDPOINT:-http://dynamodb:8000}
  region: local

dynamoDbTables:
  accounts:
    tableName: accounts_test
    phoneNumberTableName: numbers_test
    phoneNumberIdentifierTableName: pni_assignment_test
    usernamesTableName: usernames_test
    usedLinkDeviceTokensTableName: used_link_device_tokens_test
  appleDeviceChecks:
    tableName: apple_device_check
  appleDeviceCheckPublicKeys:
    tableName: apple_device_check_key_constraint
  backups:
    tableName: backups_test
  changeNumberWaitingPeriods:
    tableName: change_number_waiting_periods_test
  clientReleases:
    tableName: client_releases_test
  deletedAccounts:
    tableName: deleted_accounts_test
  deletedAccountsLock:
    tableName: deleted_accounts_lock_test
  donationPermits:
    tableName: donation_permits_test
    expiration: P7D # Duration of time until rows expire
  issuedReceipts:
    tableName: issued_receipts_test
    generator: abcdefg12345678= # random base64-encoded binary sequence
    maxReceiptsPerSubscriptionPayment:
      STRIPE: 1
      BRAINTREE: 1
      GOOGLE_PLAY_BILLING: 1
      APPLE_APP_STORE: 1
  ecKeys:
    tableName: keys_test
  ecSignedPreKeys:
    tableName: repeated_use_signed_ec_pre_keys_test
  pagedPqKeys:
    tableName: paged_pq_keys_test
  pqLastResortKeys:
    tableName: repeated_use_signed_kem_pre_keys_test
  messages:
    tableName: messages_test
    expiration: P30D # Duration of time until rows expire
  onetimeDonations:
    tableName: onetime_donations_test
    expiration: P90D
  phoneNumberIdentifiers:
    tableName: pni_test
  profileAvatars:
    tableName: profileAvatars_test
  profiles:
    tableName: profiles_test
  profilesV2:
    tableName: profilesV2_test
  pushChallenge:
    tableName: push_challenge_test
  redeemedReceipts:
    tableName: redeemed_receipts_test
  registrationRecovery:
    tableName: registration_recovery_passwords_test
    expiration: P300D # Duration of time until rows expire
  remoteConfig:
    tableName: remote_configs_test
  reportMessage:
    tableName: report_messages_test
  sandboxAccounts:
    tableName: sandbox_accounts_test
  scheduledJobs:
    tableName: scheduled_jobs_test
    expiration: P7D
  subscriptions:
    tableName: subscriptions_test
  verificationSessions:
    tableName: verification_sessions_test

pagedSingleUseKEMPreKeyStore:
  bucket: prekeys
  region: us-east-1
  endpointOverride: ${S3_ENDPOINT:-http://s3:8333}

cacheCluster: # Redis server configuration for cache cluster
  configurationUri: ${REDIS_URI:-redis://redis:6379}

pubsub: # Redis server configuration for pubsub cluster
  uri: ${REDIS_URI:-redis://redis:6379}

pushSchedulerCluster: # Redis server configuration for push scheduler cluster
  configurationUri: ${REDIS_URI:-redis://redis:6379}

rateLimitersCluster: # Redis server configuration for rate limiters cluster
  configurationUri: ${REDIS_URI:-redis://redis:6379}

directoryV2:
