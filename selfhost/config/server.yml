  serverSecret: secret://callingZkConfigPreV101.serverSecret

callingZkConfig:
  serverSecret: secret://callingZkConfigV101.serverSecret

chatZkConfig:
  serverSecret: secret://chatZkConfig.serverSecret

groupsZkConfig:
  serverPublic: ${GROUPS_ZK_SERVER_PUBLIC}
  serverSecret: secret://zkConfig-libsignal-0.42.serverSecret

dynamicConfig:
  type: file                 # edit this file on the host; reloaded within 10s
  path: /etc/signal/dynamic-config.yml
  refreshInterval: PT10S

remoteConfig:
  globalConfig: # keys and values that are given to clients on GET /v1/config
    EXAMPLE_KEY: VALUE

paymentsService:
  userAuthenticationTokenSharedSecret: secret://paymentsService.userAuthenticationTokenSharedSecret
  paymentCurrencies:
    # list of symbols for supported currencies
    - MOB
  externalClients:
    type: disabled           # no MobileCoin currency lookups

badges:
  badges:
    - id: TEST
      category: other
      sprites: # exactly 6
        - sprite-1.png
        - sprite-2.png
        - sprite-3.png
        - sprite-4.png
        - sprite-5.png
        - sprite-6.png
      svg: example.svg
      svgs:
        - light: example-light.svg
          dark: example-dark.svg
  receiptLevels:
    ONE_TIME_DONATION: TEST

subscription: # configuration for Stripe subscriptions
  badgeExpiration: P30D
  badgeGracePeriod: P15D
  backupExpiration: P30D
  backupGracePeriod: P15D
  backupFreeTierMediaDuration: P30D
  backupLevels:
    201:
      playProductId: EXAMPLE
      mediaTtl: P30D
      prices: {}
  levels:
    500:
      badge: TEST
      prices:
        # list of ISO 4217 currency codes and amounts for the given badge level
        xts:
          amount: '10'
          processorIds:
            STRIPE: price_example   # stripe Price ID
            BRAINTREE: plan_example # braintree Plan ID

loginPurchase:
  playProductId: login_example
  playOptionId: login_option_example
  appStoreProductId: login_example

oneTimeDonations:
  sepaMaximumEuros: '10000'
  boost:
    expiration: P90D
    badge: TEST
  gift:
    expiration: P90D
    badge: TEST
  currencies:
    # ISO 4217 currency codes and amounts in those currencies
    xts:
      minimum: '0.5'
      gift: '2'
      boosts:
        - '1'
        - '2'
        - '4'
        - '8'
        - '20'
        - '40'

registrationService:
  type: selfHosted           # ../registration-service (SMS/voice verification)
  host: ${REGISTRATION_HOST:-registration}
  port: 9443
  caCertificate: "${REGISTRATION_CA_CERT}"
  sharedSecret: secret://registrationService.sharedSecret
  collationKeySalt: secret://registrationService.collationKeySalt

